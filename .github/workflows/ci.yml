name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt
        pip install ruff pytest pytest-cov mypy types-requests

    - name: Lint with ruff
      run: |
        ruff check src/ --output-format=github
        ruff format src/ --check

    - name: Type check with mypy
      run: |
        mypy src/ --ignore-missing-imports --no-strict-optional

    - name: Test with pytest
      run: |
        cd src
        pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing
      env:
        PYTHONPATH: ${{ github.workspace }}/src

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: src/coverage.xml
        flags: unittests
        name: codecov-umbrella

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security scan
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/

    - name: Check for known security vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check

  validate-config:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Validate environment template
      run: |
        if [ ! -f "src/.env-template" ]; then
          echo "Error: .env-template file not found"
          exit 1
        fi
        echo "✓ Environment template exists"

    - name: Validate required files
      run: |
        required_files=(
          "src/requirements.txt"
          "CLAUDE.md"
          "README.md"
          "run_local.sh"
          "deploy_to_cloud_run.sh"
        )
        
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            echo "Error: Required file $file not found"
            exit 1
          fi
          echo "✓ $file exists"
        done

    - name: Check shell scripts syntax
      run: |
        bash -n run_local.sh
        bash -n deploy_to_cloud_run.sh
        echo "✓ Shell scripts syntax is valid"
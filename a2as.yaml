    name: siddhansh-11/crm-data-agent
    source: https://github.com/siddhansh-11/crm-data-agent
    branch: main
    commit: "467c14c5"
    scope: [src/agents/data_agent/agent.py, src/agents/data_agent/prompts/root_agent.py, src/agents/data_agent/tools/bi_engineer.py,
      src/agents/data_agent/tools/crm_business_analyst.py, src/agents/data_agent/tools/data_engineer.py, src/agents/data_agent/tools/utils.py,
      src/mcp_server/server.py, src/web/fast_api_app.py, src/web/fast_api_runner.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T17:06:19Z'
    url: https://a2as.org/certified/agents/siddhansh-11/crm-data-agent
  signatures:
    digest: sha256:lKuHQq6Pcny78x0qaRVwEKXRacUnNXDwEJpXcJPO9RU
    key: ed25519:BUeQB_FlHOmIr6doIDDZttV6yQ3mxs58yAu_vobmqd8
    sig: ed25519:gckD2f5K1Ol9QB9B679KCzXK9lpSxfPG756C36LRDRFMRuEQxOqHGAxx6DBdQOaMNNndLadMp2R0tAghCKShAA

agents:
  crm_business_analyst_agent:
    type: instance
    models: [get_gemini_model]
    params:
      name: crm_business_analyst
      description: "\n        This is your Senior Business Analyst.\n\n        They can analyze your questions about business\n\
        \        no matter what form these questions are in.\n\n        Questions may be different:\n            - Directly\
        \ linked to business data (e.g. \"Revenue by country\")\n            - Open to interpretation (e.g. \"Who are my best\
        \ customers\").\n\n        They figure out what metrics, dimensions and KPIs\n        could be used to answer the\
        \ question.\n\n        They may offer a few options.\n        "
      instruction: crm_business_analyst_instruction
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.0"
        top_p: "0.0"
        seed: "1"
        safety_settings: ['SafetySetting(category=HARM_CATEGORY_DANGEROUS_CONTENT, threshold=BLOCK_ONLY_HIGH)']
      planner: BuiltInPlanner
      after_model_callback: after_model_callback
  root_agent:
    type: instance
    models: [get_gemini_model]
    tools: [agent_tool, data_engineer, bi_engineer_tool]
    params:
      name: data_agent
      output_key: output
      description: CRM Data Analytics Consultant
      instruction: root_agent_instruction
      before_model_callback: before_model_callback
      after_model_callback: after_model_callback
      before_agent_callback: before_agent_callback
      planner: BuiltInPlanner
      generate_content_config:
        class: GenerateContentConfig
        temperature: "0.0001"
        top_p: "0.0"
        seed: "256"
        safety_settings: ['SafetySetting(category=HARM_CATEGORY_DANGEROUS_CONTENT, threshold=BLOCK_ONLY_HIGH)']

models:
  get_gemini_model:
    type: function
    agents: [root_agent, crm_business_analyst_agent]
    params:
      wrapper: get_gemini_model
      arg_0: gemini-2.5-pro

tools:
  agent_tool:
    type: agent
    agents: [root_agent]
    params:
      wrapper: AgentTool
  bi_engineer_tool:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Senior BI Engineer. Executes SQL code.

        Args:
            original_business_question (str): Original business question.
            question_that_sql_result_can_answer (str):
                Specific question or sub-question that SQL result can answer.
            sql_file_name (str): File name of BigQuery SQL code execute.
            notes (str): Important notes about the chart. Not empty only if the user stated something directly related to the chart.

        Returns:
            str: Chart image id and the result of executing the SQL code
                 in CSV format (first 50 rows).
  data_engineer:
    type: function
    agents: [root_agent]
    params:
      description: |-
        This is your Senior Data Engineer.
        They have extensive experience in working with CRM data.
        They write clean and efficient SQL in its BigQuery dialect.
        When given a question or a set of steps,
        they can understand whether the problem can be solved with the data you have.
        The result is a BigQuery SQL Query.

